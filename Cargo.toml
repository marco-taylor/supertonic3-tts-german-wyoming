[package]
name = "supertonic3-tts-german-wyoming"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/marco-taylor/supertonic3-tts-german-wyoming"
description = "German CPU text-to-speech for Home Assistant using native Wyoming and Supertonic 3"
default-run = "supertonic3-tts-german-wyoming"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
tokio = { version = "=1.53.2", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
supertonic3-tts = { version = "=1.3.0", default-features = false }
ort = "=2.0.0-rc.12"
hound = "=3.5.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

